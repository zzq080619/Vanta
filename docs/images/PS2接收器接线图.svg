<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>PS2 接收器接线图</title>
<desc>塔克创新 PS2 接收器六根线到 STM32 的连接</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="36" font-size="14" font-weight="500" fill="#2C2C2A">PS2 接收器 → STM32（塔克创新手柄）</text>
<g>
<rect x="40" y="60" width="200" height="230" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="86" font-size="14" font-weight="500" text-anchor="middle" fill="#26215C">PS2 无线接收器</text>
<text x="140" y="106" font-size="12" text-anchor="middle" fill="#3C3489">6 根线（按丝印）</text>
<rect x="60" y="120" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="140" font-size="12" text-anchor="middle" fill="#26215C">VCC（红）</text>
<rect x="60" y="154" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="174" font-size="12" text-anchor="middle" fill="#26215C">GND（黑）</text>
<rect x="60" y="188" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="208" font-size="12" text-anchor="middle" fill="#26215C">DAT（棕）数据</text>
<rect x="60" y="222" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="242" font-size="12" text-anchor="middle" fill="#26215C">CMD（橙）命令</text>
<rect x="60" y="256" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#534AB7" stroke-width="0.5"/>
<text x="140" y="276" font-size="12" text-anchor="middle" fill="#26215C">CS（黄）片选</text>
</g>
<g>
<rect x="440" y="60" width="200" height="230" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="86" font-size="14" font-weight="500" text-anchor="middle" fill="#042C53">STM32F103C8T6</text>
<text x="540" y="106" font-size="12" text-anchor="middle" fill="#0C447C">GPIOA</text>
<rect x="460" y="120" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="140" font-size="12" text-anchor="middle" fill="#042C53">3.3V</text>
<rect x="460" y="154" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="174" font-size="12" text-anchor="middle" fill="#042C53">GND</text>
<rect x="460" y="188" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="208" font-size="12" text-anchor="middle" fill="#042C53">PA4（输入上拉）</text>
<rect x="460" y="222" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="242" font-size="12" text-anchor="middle" fill="#042C53">PA5（输出）</text>
<rect x="460" y="256" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="276" font-size="12" text-anchor="middle" fill="#042C53">PA6（输出）</text>
</g>
<path d="M220 135 L460 135" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M220 169 L460 169" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M220 203 L460 203" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M220 237 L460 237" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M220 271 L460 271" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="330" y="120" font-size="11" fill="#3C3489">3.3V</text>
<text x="330" y="160" font-size="11" fill="#3C3489">GND 共地</text>
<text x="330" y="194" font-size="11" fill="#3C3489">DAT → PA4</text>
<text x="330" y="228" font-size="11" fill="#3C3489">CMD → PA5</text>
<text x="330" y="262" font-size="11" fill="#3C3489">CS → PA6</text>
<text x="40" y="320" font-size="12" fill="#5F5E5A">CLK 时钟：接收器 CLK 接 PA7（图上省略，与 CS 同排）。DAT 是输入、CMD/CS/CLK 是输出。</text>
</svg>
