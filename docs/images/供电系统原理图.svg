<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>供电系统原理图</title>
<desc>18650 电池组通过 TB6612 的 VM 给电机供电，逻辑电源与共地示意</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="36" font-size="14" font-weight="500" fill="#2C2C2A">供电系统（动力电与逻辑电分离）</text>
<g>
<rect x="40" y="60" width="150" height="72" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="115" y="86" font-size="14" font-weight="500" text-anchor="middle" fill="#633806">18650 × 2 串联</text>
<text x="115" y="108" font-size="12" text-anchor="middle" fill="#854F0B">约 7.4V（动力源）</text>
</g>
<g>
<rect x="40" y="180" width="150" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="203" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">STM32 板</text>
<text x="115" y="223" font-size="12" text-anchor="middle" fill="#444441">5V / 3.3V 逻辑电</text>
</g>
<g>
<rect x="370" y="60" width="250" height="176" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="86" font-size="14" font-weight="500" text-anchor="middle" fill="#04342C">TB6612 驱动板（×2）</text>
<text x="495" y="110" font-size="12" text-anchor="middle" fill="#0F6E56">VM=动力输入 · VCC=逻辑电 · GND=共地</text>
<rect x="395" y="126" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="440" y="146" font-size="12" font-weight="500" text-anchor="middle" fill="#04342C">VM</text>
<text x="440" y="160" font-size="11" text-anchor="middle" fill="#0F6E56">接电池正极</text>
<rect x="505" y="126" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="550" y="146" font-size="12" font-weight="500" text-anchor="middle" fill="#04342C">VCC</text>
<text x="550" y="160" font-size="11" text-anchor="middle" fill="#0F6E56">接 3.3V/5V</text>
<rect x="450" y="178" width="90" height="40" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="495" y="198" font-size="12" font-weight="500" text-anchor="middle" fill="#04342C">GND</text>
<text x="495" y="212" font-size="11" text-anchor="middle" fill="#0F6E56">三处共地</text>
</g>
<g>
<rect x="370" y="280" width="250" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="495" y="303" font-size="14" font-weight="500" text-anchor="middle" fill="#4A1B0C">4 × TT 马达（AO/BO 输出）</text>
<text x="495" y="323" font-size="12" text-anchor="middle" fill="#712B13">动力负载</text>
</g>
<path d="M190 96 L395 120" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250" y="100" font-size="12" fill="#854F0B">电池正极 → VM</text>
<path d="M190 208 L395 146" fill="none" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240" y="196" font-size="12" fill="#185FA5">逻辑电 → VCC</text>
<path d="M495 218 L495 280" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="300" width="150" height="92" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="115" y="324" font-size="13" font-weight="500" text-anchor="middle" fill="#501313">共地（关键）</text>
<text x="115" y="344" font-size="12" text-anchor="middle" fill="#791F1F">电池负极</text>
<text x="115" y="360" font-size="12" text-anchor="middle" fill="#791F1F">TB6612 GND</text>
<text x="115" y="376" font-size="12" text-anchor="middle" fill="#791F1F">STM32 GND</text>
<path d="M190 340 L370 296" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
